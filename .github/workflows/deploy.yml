name: CI/CD Pipeline - Validacao, Testes e Deploy
# Versão do Workflow: 1.1.0 - Modo Híbrido (Dry-Run Simulado & Nuvem)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 🧪 Validação, Compilação e Testes OWASP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificação Estática de Sintaxe
        run: |
          python -m py_compile src/main.py

      - name: Executar Testes Automatizados de Segurança (OWASP)
        run: |
          python -m unittest tests/test_security_and_routes.py

  deploy:
    name: 🚀 Homologação e Deploy na Nuvem
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python para Validação de Produção
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências de Produção
        run: |
          pip install -r requirements.txt

      # ETAPA 1: Simulação e Homologação de Deploy (Executada quando segredos SSH ainda não foram cadastrados)
      - name: 📦 Simulação de Deploy e Validação de Ambiente (Modo Dry-Run)
        if: ${{ env.SERVER_HOST == '' || env.SERVER_KEY == '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "============================================================"
          echo "🛡️ CI/CD DEPLOY SIMULATION - PROJETO APLICADO (DEVSECOPS)"
          echo "============================================================"
          echo "[+] Validando estrutura de arquivos de produção..."
          test -f src/main.py || exit 1
          test -f requirements.txt || exit 1
          test -f src/templates/login.html || exit 1
          test -f src/templates/dashboard.html || exit 1
          test -f src/static/css/style.css || exit 1
          echo "[✓] Estrutura de arquivos íntegra e validada."
          
          echo "[+] Testando integridade do WSGI Server (Gunicorn)..."
          python -c "from src.main import app; print('[✓] Flask WSGI App inicializada com sucesso:', app.name)"
          
          echo "------------------------------------------------------------"
          echo "ℹ️ MODO SIMULAÇÃO DE DEPLOY ATIVO (DRY-RUN):"
          echo "Para realizar o deploy em servidor físico/VM (Eixo 1):"
          echo "1. Configure os Secrets no GitHub (Settings -> Secrets -> Actions):"
          echo "   - SERVER_HOST (IP do servidor Ubuntu)"
          echo "   - SERVER_USER (ex: ubuntu)"
          echo "   - SERVER_SSH_KEY (chave privada SSH autorizada)"
          echo "2. O workflow detectará os segredos automaticamente e fará o SSH real."
          echo "------------------------------------------------------------"
          echo "[✓] Simulação de Deploy concluída com SUCESSO!"
          echo "============================================================"

      # ETAPA 2: Deploy Real via SSH (Executada apenas quando SERVER_HOST e SERVER_SSH_KEY existirem)
      - name: 🌐 Executar Deploy Remoto via SSH (Servidor em Nuvem)
        if: ${{ env.SERVER_HOST != '' && env.SERVER_KEY != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_KEY: ${{ secrets.SERVER_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "[+] Iniciando atualização da aplicação no servidor..."
            APP_DIR="/opt/projeto-aplicado"
            
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
            fi
            
            cd $APP_DIR
            
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            if systemctl is-active --quiet projeto-aplicado; then
              sudo systemctl restart projeto-aplicado
              echo "[+] Serviço projeto-aplicado reiniciado com sucesso!"
            else
              echo "[!] Serviço systemd não configurado ou inativo. Verifique o README.md."
            fi
            
            echo "[✓] Deploy finalizado com sucesso via GitHub Actions!"
