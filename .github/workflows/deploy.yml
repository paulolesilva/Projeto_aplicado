name: CI/CD Pipeline - Deploy para Servidor Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 🧪 Validação e Testes de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificação de Sintaxe Python
        run: |
          python -m py_compile src/main.py

  deploy:
    name: 🚀 Deploy Automatizado na Nuvem (Ubuntu Server)
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "[+] Iniciando atualização da aplicação no servidor..."
            
            APP_DIR="/opt/projeto-aplicado"
            
            # Se a pasta não existir, criar ou clonar
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
            fi
            
            cd $APP_DIR
            
            # Atualiza o código fonte ou sincroniza
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Atualiza ambiente virtual e dependências
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            # Reinicia o serviço no systemd (ex: gunicorn/app)
            if systemctl is-active --quiet projeto-aplicado; then
              sudo systemctl restart projeto-aplicado
              echo "[+] Serviço projeto-aplicado reiniciado com sucesso!"
            else
              echo "[!] Serviço systemd não configurado ou inativo. Verifique o README.md."
            fi
            
            echo "[✓] Deploy finalizado com sucesso via GitHub Actions!"
